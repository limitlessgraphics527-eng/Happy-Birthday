```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday</title>

<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(
      135deg,
      #ffd6e7,
      #ffb6d5,
      #f783b8,
      #ffd9e8
    );
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  /* Floating hearts and sparkles */
  .float {
    position: fixed;
    bottom: -30px;
    font-size: 20px;
    animation: floatUp 7s linear forwards;
    opacity: 0.8;
    z-index: 1;
    pointer-events: none;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0);
      opacity: 1;
    }

    100% {
      transform: translateY(-110vh);
      opacity: 0;
    }
  }

  /* Center the birthday card */
  .container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    z-index: 2;
    box-sizing: border-box;
  }

  /* Birthday card */
  .card {
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(255, 255, 255, 0.7);
    max-width: 420px;
    width: 100%;
    padding: 28px;
    border-radius: 30px;
    box-shadow: 0 15px 40px rgba(173, 35, 96, 0.25);
    text-align: center;
    box-sizing: border-box;
    animation: appear 1s ease;
  }

  @keyframes appear {
    from {
      opacity: 0;
      transform: translateY(20px) scale(0.96);
    }

    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  h1 {
    color: #9e1458;
    font-size: 32px;
    margin: 10px 0 18px;
    text-shadow: 0 2px 8px rgba(255, 255, 255, 0.8);
  }

  .heart {
    font-size: 38px;
    margin-bottom: 5px;
    animation: heartbeat 1.5s infinite;
  }

  @keyframes heartbeat {
    0%, 100% {
      transform: scale(1);
    }

    50% {
      transform: scale(1.15);
    }
  }

  img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 22px;
    margin: 18px 0;
    border: 3px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 10px 25px rgba(158, 20, 88, 0.25);
    box-sizing: border-box;
  }

  audio {
    width: 100%;
    margin-top: 15px;
  }

  @media (max-width: 480px) {
    .container {
      padding: 15px;
    }

    .card {
      padding: 22px;
    }

    h1 {
      font-size: 27px;
    }
  }
</style>
</head>

<body>

<!-- Floating hearts and sparkles -->
<script>
  const icons = ["💕", "✨", "💗", "🎀", "♡"];

  function createFloat() {
    const el = document.createElement("div");

    el.className = "float";
    el.textContent =
      icons[Math.floor(Math.random() * icons.length)];

    el.style.left = Math.random() * 100 + "vw";
    el.style.fontSize = (14 + Math.random() * 26) + "px";
    el.style.animationDuration = (5 + Math.random() * 4) + "s";

    document.body.appendChild(el);

    setTimeout(() => {
      el.remove();
    }, 9000);
  }

  setInterval(createFloat, 700);
</script>

<!-- Birthday card -->
<div class="container">

  <div class="card">

    <div class="heart">💕</div>

    <h1>Happy Birthday 🎂</h1>

    <img
      src="photo.jpg"
      alt="Birthday Photo"
    >

    <audio controls>
      <source src="audio.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

  </div>

</div>

</body>
</html>
